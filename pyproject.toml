[project]
name = "docseek"
version = "0.1.0"
description = "Self-hosted property graph and entity graph knowledge workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jieba>=0.42.1",
  "langgraph>=0.2.0",
  "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.4",
  "neo4j>=5.25.0",
  "neo4j-graphrag>=1.18.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "openpyxl>=3.1.5",
  "pytest>=8.3.0",
]

[project.scripts]
docseek-api = "backend.app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
